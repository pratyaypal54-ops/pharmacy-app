# --- MySQL connection ---
# Change "pharmacy_db" if you name your database differently.
# Make sure this database already exists in MySQL (CREATE DATABASE pharmacy_db;)
spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy_db
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate/JPA ---
# "update" = Hibernate auto-creates/updates tables from your @Entity classes
# on startup. Great for learning; in real production you'd use migrations instead.
spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate runs in your console - useful for learning
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
