<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicines - Pharmacy App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header>
        <h1>Available Medicines</h1>
    </header>

    <main>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>In Stock</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="med : ${medicines}">
                    <td th:text="${med.name}">Medicine Name</td>
                    <td th:text="${med.category}">Category</td>
                    <td th:text="'₹' + ${med.sellingPrice}">Price</td>
                    <!-- Show "Only X left" if below threshold, otherwise plain quantity -->
                    <td th:text="${med.quantity} lt ${med.lowStockThreshold} ? 'Only ' + ${med.quantity} + ' left' : ${med.quantity}">
                        Stock
                    </td>
                </tr>
            </tbody>
        </table>

        <p th:if="${medicines.isEmpty()}">No medicines available yet.</p>
    </main>

</body>
</html>
