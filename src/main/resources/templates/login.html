<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#080b11">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/img/icon-192.png}">
    <link rel="apple-touch-icon" th:href="@{/img/icon-192.png}">
    <title>Admin Login - PharmCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh;">

<div style="width: 100%; max-width: 420px; padding: 20px;">

    <!-- BRAND EMBLEM -->
    <div style="text-align: center; margin-bottom: 24px;">
        <div class="brand-logo" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto 12px auto;">&#10010;</div>
        <div class="brand-title" style="font-size: 1.4rem;">Pharm<span>Care</span></div>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin: 4px 0 0 0;">Retail Pharmacy Management & POS System</p>
    </div>

    <!-- ALERTS -->
    <div th:if="${param.error}" class="alert alert-danger" style="margin-bottom: 16px;">
        <span>&#9888;</span> <span>Authentication failed: Invalid credentials.</span>
    </div>
    <div th:if="${param.logout}" class="alert alert-success" style="margin-bottom: 16px;">
        <span>&#10003;</span> <span>Session terminated. You have been logged out.</span>
    </div>

    <!-- LOGIN CARD -->
    <div class="cyber-card" style="position: relative; overflow: hidden;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));"></div>
        
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="usernameInput">Username</label>
                <input type="text" 
                       id="usernameInput" 
                       name="username" 
                       class="cyber-input" 
                       placeholder="Enter username" 
                       required 
                       autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="passwordInput">Password</label>
                <input type="password" 
                       id="passwordInput" 
                       name="password" 
                       class="cyber-input" 
                       placeholder="••••••••" 
                       required>
            </div>

            <div style="display: flex; align-items: center; gap: 8px; margin: 14px 0 16px 0;">
                <input type="checkbox" 
                       id="rememberMe" 
                       name="remember-me" 
                       checked 
                       style="width: 16px; height: 16px; accent-color: var(--neon-green); cursor: pointer;">
                <label for="rememberMe" style="font-size: 0.82rem; color: var(--text-main); cursor: pointer; user-select: none;">
                    Remember this device (Stay logged in for 30 days)
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 12px;">
                Authenticate &rarr;
            </button>
        </form>

        <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-dim); display: flex; justify-content: space-between; align-items: center;">
            <a th:href="@{/medicines}" class="btn btn-outline btn-sm">&larr; Public Catalog</a>
            <span class="badge badge-category" style="font-size: 0.7rem;">Default: admin / admin123</span>
        </div>
    </div>
</div>

</body>
</html>
