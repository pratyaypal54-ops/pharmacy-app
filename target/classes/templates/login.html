<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main style="max-width: 400px; margin: 80px auto;">
        <h1>Admin Login</h1>

        <!--
          th:action="@{/login}" - Spring Security automatically listens for
          a POST to /login and checks the username/password for us. We never
          write a @PostMapping("/login") ourselves - Security handles it.
        -->
        <form th:action="@{/login}" method="post">
            <div style="margin-bottom: 12px;">
                <label>Username</label><br>
                <input type="text" name="username" required style="width:100%; padding:8px;">
            </div>
            <div style="margin-bottom: 12px;">
                <label>Password</label><br>
                <input type="password" name="password" required style="width:100%; padding:8px;">
            </div>
            <button type="submit" style="padding:10px 20px;">Login</button>
        </form>

        <!-- Shown if the URL has ?error on it, e.g. after a wrong password -->
        <p th:if="${param.error}" style="color:red;">Invalid username or password.</p>
        <p th:if="${param.logout}" style="color:green;">You have been logged out.</p>
    </main>
</body>
</html>
