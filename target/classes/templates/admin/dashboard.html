<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Admin Dashboard</h1>
</header>
<main>
    <div style="display:flex; gap:16px; margin-bottom:20px;">
        <a th:href="@{/admin/add-stock}"><button type="button">Add Stock</button></a>
        <a th:href="@{/admin/sell}"><button type="button">Sell</button></a>
        <a th:href="@{/admin/edit}"><button type="button">Edit</button></a>
    </div>

    <p><a th:href="@{/admin/reports}">📊 View Sales Reports</a></p>

    <form th:action="@{/logout}" method="post" style="margin-top:20px;">
        <button type="submit">Logout</button>
    </form>
</main>
</body>
</html>
